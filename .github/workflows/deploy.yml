name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*.*.*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin release directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/aq-data-foobot"
          rsync -av \
            --exclude-from="$GITHUB_WORKSPACE/public_html/wp-content/plugins/aq-data-foobot/.distignore" \
            "$GITHUB_WORKSPACE/public_html/wp-content/plugins/aq-data-foobot/" \
            "$GITHUB_WORKSPACE/build/aq-data-foobot/"

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: aq-data-foobot
          BUILD_DIR: build/aq-data-foobot

      - name: Zip release asset
        run: cd build && zip -r ../aq-data-foobot.zip aq-data-foobot

      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aq-data-foobot.zip
