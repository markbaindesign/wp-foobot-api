name: Test

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [master, develop]
  workflow_call:

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
        wp: ["latest", "7.2-RC3"]

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: public_html/wp-content/plugins/aq-data-foobot

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install WordPress test suite
        run: yes | bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 ${{ matrix.wp }}

      - name: Confirm the WordPress version under test
        if: matrix.wp != 'latest'
        run: grep -F "\$wp_version = '${{ matrix.wp }}'" /tmp/wordpress/wp-includes/version.php

      - name: Run PHPUnit
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib vendor/bin/phpunit

  lint:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    # Non-blocking for now: this plugin has a backlog of pre-existing WPCS
    # errors (escaping, i18n, Yoda conditions, variable naming) that predate
    # this pipeline. PHPUnit above is the hard gate; tighten this once the
    # backlog is cleared.
    continue-on-error: true

    defaults:
      run:
        working-directory: public_html/wp-content/plugins/aq-data-foobot

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    # Non-blocking until the first run's findings have been reviewed.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Build the release directory
        run: |
          mkdir -p build/air-quality-data-from-foobot
          rsync -a --exclude-from=public_html/wp-content/plugins/aq-data-foobot/.distignore public_html/wp-content/plugins/aq-data-foobot/ build/air-quality-data-from-foobot/

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/air-quality-data-from-foobot
